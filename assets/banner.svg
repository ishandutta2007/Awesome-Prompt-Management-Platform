<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      .pulse-node { animation: pulse 3s infinite ease-in-out; }
      .dash-flow { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
      .glow-orbit { animation: rotate 12s linear infinite; transform-origin: 1000px 180px; }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.08); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -240; }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M 200,0 L 200,360 M 400,0 L 400,360 M 600,0 L 600,360 M 800,0 L 800,360 M 1000,0 L 1000,360" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Decorative Animated Flow Connections -->
  <path class="dash-flow" d="M 850 180 Q 930 100 1000 180 T 1150 180" fill="none" stroke="#6366f1" stroke-opacity="0.5" stroke-width="2"/>
  <path class="dash-flow" d="M 820 220 Q 910 280 1000 180 T 1120 120" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Glowing Orbit Graphics -->
  <g class="glow-orbit">
    <circle cx="1000" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="12 12"/>
    <circle cx="1000" cy="180" r="130" fill="none" stroke="#c084fc" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="8 16"/>
    <circle cx="1090" cy="180" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="910" cy="180" r="5" fill="#818cf8"/>
  </g>

  <!-- Central Graphic Node -->
  <circle cx="1000" cy="180" r="50" fill="url(#bg)" stroke="#818cf8" stroke-width="3" filter="url(#glow)"/>
  <text x="1000" y="187" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#e2e8f0">🚀</text>

  <!-- Content Container Glass Card -->
  <rect x="50" y="45" width="750" height="270" rx="14" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  
  <!-- Category Tag -->
  <rect x="80" y="75" width="220" height="28" rx="14" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1"/>
  <text x="190" y="94" text-anchor="middle" class="badge">🔥 CURATED LLMOPS DIRECTORY</text>

  <!-- Title & Subtitle -->
  <text x="80" y="155" class="title">Awesome Prompt Management</text>

  <text x="80" y="195" class="subtitle">The Ecosystem Guide for Prompt Versioning, Evaluation &amp; LLMOps</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 230)">
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="70" y="21" text-anchor="middle" class="badge">✨ SaaS Products</text>

    <rect x="152" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="234" y="21" text-anchor="middle" class="badge">⭐ Open-Source Repos</text>

    <rect x="329" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="399" y="21" text-anchor="middle" class="badge">📊 Market Sizing</text>

    <rect x="481" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="556" y="21" text-anchor="middle" class="badge">🏷️ Star Badges</text>
  </g>
</svg>
